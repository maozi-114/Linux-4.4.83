name: Build GM01 / SL8541E Kernel

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/gm01-kernel-build.yml
nput/touchscreen/**/a      - drivers/video/adf/sprd/**
      - drivers/input/touchscreen/**
      - configs/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-androideabi-
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex \
            libelf-dev libssl-dev python-is-python3
      - name: Fetch Android GCC 4.9
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32
          test -x gcc32/bin/arm-linux-androideabi-gcc
          gcc32/bin/arm-linux-androideabi-gcc --version | head -1
          echo "$GITHUB_WORKSPACE/gcc32/bin" >> "$GITHUB_PATH"
      - name: Use extracted GM01 stock config
        run: |
          mkdir -p out
          cp configs/gm01-stock-4.4.83.config out/.config
          make O=out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" olddefconfig 2>&1 | tee configure.log
      - name: Build kernel once (Image and zImage)
        run: |
          set -o pipefail
          make -j"$(nproc)" O=out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" zImage 2>&1 | tee build.log
          test -s out/arch/arm/boot/Image
          test -s out/arch/arm/boot/zImage

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GM01-SL8541E-build-log
          path: |
            configure.log
            build.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stage named kernel outputs
        if: success()
        run: |
          mkdir -p artifacts
          cp out/arch/arm/boot/Image artifacts/image
          cp out/arch/arm/boot/zImage artifacts/zimage

      - name: Upload Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GM01-SL8541E-image
          path: artifacts/image
          if-no-files-found: error
          retention-days: 14

      - name: Upload zImage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GM01-SL8541E-zimage
          path: artifacts/zimage
          if-no-files-found: error
          retention-days: 14
